<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Convert text to speech using browser Web Speech API"><title>Text to Speech — DevKit Tools</title><style>
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#c9d1d9;--accent:#58a6ff;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:12px;}
.header a{color:var(--text);text-decoration:none;font-size:13px;}
.container{max-width:700px;margin:0 auto;padding:32px 24px;flex:1;}
h1{font-size:24px;color:#f0f6fc;margin-bottom:20px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;}
textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-size:14px;resize:vertical;min-height:100px;}
textarea:focus{outline:none;border-color:var(--accent);}
.controls{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;align-items:center;}
select{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px;color:var(--text);font-size:13px;}
input[type=range]{flex:1;min-width:100px;}
.btn{background:#238636;color:#fff;border:none;border-radius:6px;padding:10px 24px;font-size:14px;cursor:pointer;font-weight:500;}
.btn:hover{background:#2ea043;}
.btn:disabled{background:#30363d;color:var(--text);cursor:default;}
label{font-size:12px;color:var(--text);display:block;margin-bottom:4px;}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:#0d1117}::-webkit-scrollbar-thumb{background:#30363d;border-radius:4px}::-webkit-scrollbar-thumb:hover{background:#484f58}*:focus-visible{outline:2px solid #58a6ff;outline-offset:2px}::selection{background:rgba(88,166,255,0.3);color:#fff}</style><script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Text to Speech","description":"Convert text to speech using browser Web Speech API","url":"https://479464887-rgb.github.io/text-to-speech/","applicationCategory":"DeveloperApplication","operatingSystem":"Web","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}
</script>
</head><body>
<div class="header"><a href="https://devkit-tools.xyz">← DevKit</a><span style="color:var(--text);font-size:13px;">Text to Speech</span></div>
<div class="container"><h1>🗣️ Text to Speech</h1>
<div class="card"><textarea id="text" placeholder="Type text to speak...">Hello! This is the Web Speech API. You can change the voice and speed using the controls below.</textarea>
<div class="controls">
<div><label>Voice</label><select id="voice-select"></select></div>
<div><label>Rate: <span id="rate-val">1.0</span>x</label><input type="range" id="rate" min="0.5" max="2" step="0.1" value="1"></div>
<button class="btn" id="speak-btn">🔊 Speak</button><button class="btn" id="stop-btn" style="background:var(--surface);border:1px solid var(--border);">⏹ Stop</button>
</div></div></div>
<script>
'use strict';
const synth=window.speechSynthesis;let voices=[];
function loadVoices(){voices=synth.getVoices();const sel=document.getElementById('voice-select');sel.innerHTML=voices.map((v,i)=>'<option value="'+i+'">'+v.name+' ('+v.lang+')</option>').join('')}
loadVoices();synth.onvoiceschanged=loadVoices;
document.getElementById('rate').addEventListener('input',e=>document.getElementById('rate-val').textContent=e.target.value);
document.getElementById('speak-btn').addEventListener('click',()=>{synth.cancel();const u=new SpeechSynthesisUtterance(document.getElementById('text').value);const vi=document.getElementById('voice-select').value;if(voices[vi])u.voice=voices[vi];u.rate=parseFloat(document.getElementById('rate').value);synth.speak(u)});
document.getElementById('stop-btn').addEventListener('click',()=>synth.cancel());
</script>  <footer style="padding:16px 24px;border-top:1px solid #21262d;text-align:center;font-size:12px;color:#484f58">

  </footer>
</body></html>
